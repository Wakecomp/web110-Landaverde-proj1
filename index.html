<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bono App | Sign Up</title>

  <!-- Favicon -->
  <link rel="icon" href="Images/favicon.png">

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <!-- Open Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Body */
    body {
      font-family: 'Open Sans', sans-serif;
      background: black;
      color: white;
      line-height: 1.6;
    }

    /* Background */
    .wrapper {
      min-height: 100vh;

      background:
        linear-gradient(
          to bottom,
          rgba(255, 64, 50, 0.8),
          rgba(71, 17, 116, 0.9)
        ),
        url('Images/background.jpg') no-repeat center/cover;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px;
    }

    /* Embedded Bono Logo */
    .logo {
      display: inline-block;
      width: 130px;
      text-decoration: none;
    }

    .logo svg {
      display: block;
      width: 130px;
      height: auto;
    }

    .header .header-right {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .header .header-right i {
      margin-right: 5px;
    }

    .header .header-right a {
      color: white;
    }

    .header .header-right a:hover {
      color: purple;
    }

    /* Main Content */
    .main-content {
      display: flex;
      gap: 50px;
      max-width: 1100px;
      margin: 200px auto;
      justify-content: center;
      align-items: start;
      height: 100%;
      padding: 0 40px;
    }

    .main-content form {
      flex: 1;
    }

    .main-content .text-container {
      flex: 1;
    }

    /* Form */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      outline: 0;
    }

    .form-group textarea {
      height: 100px;
      resize: none;
      margin-bottom: 10px;
    }

    /* Button */
    .btn {
      display: block;
      width: 100%;
      padding: 15px 20px;
      border: 0;
      border-radius: 20px;
      background-color: #ff4032;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #ff5c4d;
    }

    /* Text */
    .text-container h1 {
      font-size: 50px;
      margin: 50px 0 20px;
      line-height: 1.2;
    }

    .text-container {
      font-size: 18px;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .header {
        padding: 30px 10px 10px;
      }

      .header,
      .header .header-right {
        flex-direction: column;
        gap: 10px;
      }

      .main-content {
        flex-direction: column-reverse;
        justify-content: start;
        margin: auto;
        padding: 50px;
      }

      .main-content form,
      .main-content .text-container {
        width: 100%;
      }

      .main-content h1 {
        font-size: 40px;
        text-align: center;
        line-height: 1.4;
      }

      .main-content p {
        display: none;
      }
    }

    /* Landscape / Short Screens */
    @media (max-height: 500px) {
      .main-content {
        margin: 0 auto;
      }

      .main-content h1 {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <header class="header">

      <!-- Bono Logo Embedded Directly Into HTML -->
      <a href="index.html" class="logo">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 130 50"
          role="img"

          ></path>

          <text
            x="55"
            y="36"
            fill="white"
            font-size="26"
            font-family="Open Sans, Arial, sans-serif"
            font-weight="600"
          >
            Bono
          </text>

        </svg>

      </a>

      <div class="header-right">

        <div>
          <i class="fas fa-envelope"></i>
          contact@bono.com
        </div>

        <div>
          <i class="fas fa-phone"></i>
          (+31) 021-800-8244
        </div>

        <a href="#">
          <i class="fa-brands fa-twitter"></i>
        </a>

      </div>

    </header>

    <main class="main-content">

      <form>

        <div class="form-group">
          <label for="name">Name</label>
          <input
            type="text"
            name="name"
            id="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            name="email"
            id="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            name="message"
            id="message"
          ></textarea>
        </div>

        <div class="form-group">
          <button type="submit" class="btn">
            Submit
          </button>
        </div>

      </form>

      <div class="text-container">

        <h1>Coming Soon For Every Developer</h1>

        <p>
          Our new Bono web app will change the way you think about
          content management and will allow you to focus on what's
          really important. Use the contact form to send us your
          thoughts
        </p>

      </div>

    </main>

  </div>

</body>
</html>
